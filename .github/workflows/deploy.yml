name: Deploy to Server

on:
  push:
    branches: [master]

# 并发保护：同一分支的部署任务排队串行执行，避免并发竞态
concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-g3wn4otglvq1me5n.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 同步 mysql:8.4 到 ACR
        run: |
          docker pull mysql:8.4
          docker tag mysql:8.4 crpi-g3wn4otglvq1me5n.cn-hangzhou.personal.cr.aliyuncs.com/zhangyuning-bookkeeping/mysql:8.4
          docker push crpi-g3wn4otglvq1me5n.cn-hangzhou.personal.cr.aliyuncs.com/zhangyuning-bookkeeping/mysql:8.4

      - name: 构建并推送 backend 镜像
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: crpi-g3wn4otglvq1me5n.cn-hangzhou.personal.cr.aliyuncs.com/zhangyuning-bookkeeping/bookkeeping-backend:latest

      - name: 构建并推送 frontend 镜像
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: crpi-g3wn4otglvq1me5n.cn-hangzhou.personal.cr.aliyuncs.com/zhangyuning-bookkeeping/bookkeeping-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          script: |
            # 登录阿里云 ACR（国内，拉取快）
            echo "${{ secrets.ACR_PASSWORD }}" | docker login crpi-g3wn4otglvq1me5n.cn-hangzhou.personal.cr.aliyuncs.com -u ${{ secrets.ACR_USERNAME }} --password-stdin
            cd /home/admin/bookkeeping
            git pull origin master
            cd deploy
            # app-update 目录（manifest + APK）由宿主机挂载托管，确保存在（首次/重建后）
            mkdir -p /home/admin/app-update
            # 镜像已在 GitHub Actions 构建并推送，这里只拉取不构建，避免低内存服务器 OOM
            docker compose pull
            docker compose up -d
            docker image prune -f
            docker compose ps
