name: Deploy to Server

on:
  push:
    branches: [master]

# 并发保护：同一分支的部署任务排队串行执行，避免并发竞态
concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 backend 镜像
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/zhanghan4141-oss/bookkeeping-backend:latest

      - name: 构建并推送 frontend 镜像
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/zhanghan4141-oss/bookkeeping-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          script: |
            # 登录 GHCR 以拉取私有镜像（用 GITHUB_TOKEN，packages: read 权限）
            echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /home/admin/bookkeeping
            git pull origin master
            cd deploy
            # 镜像已在 GitHub Actions 构建并推送，这里只拉取不构建，避免低内存服务器 OOM
            docker compose pull
            docker compose up -d
            docker image prune -f
            docker compose ps
