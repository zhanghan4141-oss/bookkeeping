name: Generate Keystore

# 手动触发：在 GitHub Actions 里生成 release.keystore（本机无需 JDK）。
# 生成后上传为 artifact，下载其中的 release.keystore.b64.txt 内容，
# 填到仓库 Secret RELEASE_KEYSTORE_B64（密码填 RELEASE_KEYSTORE_PASSWORD）。
on:
  workflow_dispatch:
    inputs:
      password:
        description: '签名密码（至少 6 位）'
        required: true
      alias:
        description: '别名'
        required: false
        default: 'bookkeeping'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 生成 keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.password }}" \
            -keypass "${{ github.event.inputs.password }}" \
            -dname "CN=bookkeeping, OU=dev, O=zhanghan, C=CN"

      - name: 生成 base64 文本
        run: |
          base64 release.keystore > release.keystore.b64.txt
          echo "签名密码（用于 RELEASE_KEYSTORE_PASSWORD）：${{ github.event.inputs.password }}"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            release.keystore.b64.txt
