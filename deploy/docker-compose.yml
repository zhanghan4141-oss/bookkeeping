services:
  db:
    image: crpi-g3wn4otglvq1me5n.cn-hangzhou.personal.cr.aliyuncs.com/zhangyuning-bookkeeping/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bookkeeping
      MYSQL_USER: bookkeeping
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - internal

  backend:
    image: crpi-g3wn4otglvq1me5n.cn-hangzhou.personal.cr.aliyuncs.com/zhangyuning-bookkeeping/bookkeeping-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://bookkeeping:${MYSQL_PASSWORD}@db:3306/bookkeeping
      PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      FRONTEND_URL: https://${DOMAIN}
    depends_on:
      - db
    networks:
      - internal

  # 前端：容器内 nginx 托管 dist + 反代 /api 到 backend。
  # 只暴露 8081 给宿主机 nginx 反代，不占 80/443（已被现有服务占用）。
  frontend:
    image: crpi-g3wn4otglvq1me5n.cn-hangzhou.personal.cr.aliyuncs.com/zhangyuning-bookkeeping/bookkeeping-frontend:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    # app-update（manifest.json + bookkeeping-latest.apk）走宿主机目录挂载，
    # 发 APK 时由 release-apk.yml 直传到 /home/admin/app-update，无需重建 frontend 镜像
    volumes:
      - /home/admin/app-update:/usr/share/nginx/html/app-update
    depends_on:
      - backend
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge
