# ============================================================
# bookkeeping.zhangyuning.xyz 的宿主机 nginx 配置
# 用法：把下面两个 server 块，粘贴到你现有的 nginx 配置里
# （通常位于 /etc/nginx/conf.d/ 或 /etc/nginx/sites-available/，
#   与 tongshandagong 的配置并列，互不影响）
# 改完后执行：nginx -t && systemctl reload nginx
# ============================================================

# HTTP：重定向到 HTTPS
server {
    listen 80;
    server_name bookkeeping.zhangyuning.xyz;
    return 301 https://$host$request_uri;
}

# HTTPS：反代到 Docker frontend 容器（8081 端口）
server {
    listen 443 ssl;
    server_name bookkeeping.zhangyuning.xyz;

    # ===== 证书路径（改成你自己的证书实际位置）=====
    ssl_certificate     /etc/nginx/certs/bookkeeping.zhangyuning.xyz.pem;
    ssl_certificate_key /etc/nginx/certs/bookkeeping.zhangyuning.xyz.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
